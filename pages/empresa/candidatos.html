<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidatos — ConectaLeiria</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/database.js"></script>
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <a class="navbar-logo" href="../../index.html">
      <span class="logo-texto">Conecta<span class="logo-verde">Leiria</span></span>
    </a>
    <div class="navbar-ctas">
      <span id="nomeUtilizador" class="navbar-user">🏢</span>
      <button onclick="DB.logout()" class="btn btn-secundario">Sair</button>
    </div>
  </nav>

  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-item">🏠 <span>Dashboard</span></a>
        <a href="candidatos.html" class="sidebar-item ativo">👥 <span>Ver Candidatos</span></a>
        <a href="vagas.html" class="sidebar-item">📋 <span>Gerir Vagas</span></a>
        <a href="#" onclick="DB.logout()" class="sidebar-item sair">🚪 <span>Sair</span></a>
      </div>
    </aside>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h1 class="dash-titulo">Candidatos Disponíveis</h1>
          <p class="dash-sub">Filtra e encontra o candidato ideal para a tua empresa.</p>
        </div>
        <div class="candidatos-total">
          <span id="totalCandidatos">0</span> candidatos
        </div>
      </div>

      <!-- FILTROS -->
      <div class="filtros-wrap">
        <div class="filtro-grupo">
          <label>🎯 Área</label>
          <select id="filtroArea" onchange="filtrarCandidatos()">
            <option value="">Todas as áreas</option>
            <option>Restauração</option>
            <option>Hotelaria</option>
            <option>Comércio</option>
            <option>Indústria</option>
            <option>Construção</option>
            <option>Saúde & Bem-estar</option>
            <option>Tecnologia</option>
            <option>Outra</option>
          </select>
        </div>
        <div class="filtro-grupo">
          <label>📍 Concelho</label>
          <select id="filtroConcelho" onchange="filtrarCandidatos()">
            <option value="">Todos os concelhos</option>
            <option>Nazaré</option>
            <option>Leiria</option>
            <option>Alcobaça</option>
            <option>Caldas da Rainha</option>
            <option>Marinha Grande</option>
            <option>Pombal</option>
            <option>Batalha</option>
            <option>Peniche</option>
            <option>Óbidos</option>
          </select>
        </div>
        <div class="filtro-grupo">
          <label>💼 Experiência</label>
          <select id="filtroExperiencia" onchange="filtrarCandidatos()">
            <option value="">Qualquer experiência</option>
            <option>Sem experiência</option>
            <option>Menos de 1 ano</option>
            <option>1 a 2 anos</option>
            <option>3 a 5 anos</option>
            <option>Mais de 5 anos</option>
          </select>
        </div>
        <button onclick="limparFiltros()" class="btn btn-secundario" style="align-self:flex-end">🗑️ Limpar</button>
      </div>

      <!-- LISTA DE CANDIDATOS -->
      <div id="gridCandidatos" class="candidatos-grid">
        <div class="resumo-vazio" style="grid-column:1/-1">
          <div style="font-size:3rem;margin-bottom:1rem">👥</div>
          <h3>Ainda não há candidatos registados</h3>
          <p>Assim que os candidatos se registarem e preencherem o currículo, aparecerão aqui.</p>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL CURRÍCULO -->
  <div id="modalCurriculo" class="modal-overlay" style="display:none">
    <div class="modal-caixa">
      <button class="modal-fechar" onclick="fecharModal()">✕</button>
      <div id="modalConteudo"></div>
    </div>
  </div>

  <script src="../../js/app.js"></script>
  <script src="../../js/candidaturas.js"></script>
  <script src="../../js/candidatos.js"></script>
</body>
</html>
