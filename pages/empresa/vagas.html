<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicar Vagas — ConectaLeiria</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />

</head>
<body>
  <nav class="navbar" id="navbar">
    <a class="navbar-logo" href="../../index.html"><span class="logo-texto">Conecta<span class="logo-verde">Leiria</span></span></a>
    <div class="navbar-ctas">
      <span id="nomeUtilizador" class="navbar-user">🏢 A carregar...</span>
      <button onclick="DB.logout()" class="btn btn-secundario">Sair</button>
    </div>
  </nav>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-item">🏠 <span>Dashboard</span></a>
        <a href="candidatos.html" class="sidebar-item">👥 <span>Ver Candidatos</span></a>
        <a href="vagas.html" class="sidebar-item ativo">📋 <span>As Minhas Vagas</span></a>
        <a href="#" onclick="DB.logout()" class="sidebar-item sair">🚪 <span>Sair</span></a>
      </div>
    </aside>
    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h1 class="dash-titulo">📋 As Minhas Vagas</h1>
          <p class="dash-sub">Publica e gere as vagas da tua empresa</p>
        </div>
        <button class="btn btn-primario" onclick="abrirModal()">+ Nova Vaga</button>
      </div>

      <div id="listaVagas" style="display:flex;flex-direction:column;gap:1rem;"></div>
    </main>
  </div>

  <!-- MODAL NOVA VAGA -->
  <div id="modalVaga" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:white;border-radius:20px;padding:2rem;max-width:560px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,0.3);max-height:90vh;overflow-y:auto;">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:1.5rem;color:#1a1a2e;">📋 Nova Vaga</h2>
      <div style="display:flex;flex-direction:column;gap:1rem;">
        <div><label style="font-size:.85rem;font-weight:600;color:#2d2d2d;display:block;margin-bottom:.4rem;">Título da Vaga</label>
        <input id="vTitulo" type="text" placeholder="ex: Empregado de Mesa" style="width:100%;padding:.75rem 1rem;border:2px solid #e8e8e8;border-radius:10px;font-size:.95rem;box-sizing:border-box;"></div>
        <div><label style="font-size:.85rem;font-weight:600;color:#2d2d2d;display:block;margin-bottom:.4rem;">Área</label>
        <select id="vArea" style="width:100%;padding:.75rem 1rem;border:2px solid #e8e8e8;border-radius:10px;font-size:.95rem;box-sizing:border-box;">
          <option value="">Seleciona...</option>
          <option>Restauração</option><option>Hotelaria</option><option>Comércio</option>
          <option>Indústria</option><option>Construção</option><option>Saúde & Bem-estar</option>
          <option>Tecnologia</option><option>Outra</option>
        </select></div>
        <div><label style="font-size:.85rem;font-weight:600;color:#2d2d2d;display:block;margin-bottom:.4rem;">Concelho</label>
        <select id="vConcelho" style="width:100%;padding:.75rem 1rem;border:2px solid #e8e8e8;border-radius:10px;font-size:.95rem;box-sizing:border-box;">
          <option value="">Seleciona...</option>
          <option>Nazaré</option><option>Leiria</option><option>Alcobaça</option>
          <option>Caldas da Rainha</option><option>Marinha Grande</option><option>Pombal</option>
          <option>Batalha</option><option>Peniche</option><option>Óbidos</option>
        </select></div>
        <div><label style="font-size:.85rem;font-weight:600;color:#2d2d2d;display:block;margin-bottom:.4rem;">Tipo de Contrato</label>
        <select id="vContrato" style="width:100%;padding:.75rem 1rem;border:2px solid #e8e8e8;border-radius:10px;font-size:.95rem;box-sizing:border-box;">
          <option value="">Seleciona...</option>
          <option>Tempo Inteiro</option><option>Tempo Parcial</option>
          <option>Temporário</option><option>Estágio</option>
        </select></div>
        <div><label style="font-size:.85rem;font-weight:600;color:#2d2d2d;display:block;margin-bottom:.4rem;">Descrição</label>
        <textarea id="vDescricao" placeholder="Descreve a vaga, requisitos e condições..." style="width:100%;min-height:120px;padding:.75rem 1rem;border:2px solid #e8e8e8;border-radius:10px;font-size:.95rem;box-sizing:border-box;resize:vertical;"></textarea></div>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1.5rem;">
        <button onclick="fecharModal()" style="flex:1;padding:.85rem;border:2px solid #e8e8e8;border-radius:10px;background:white;cursor:pointer;font-size:.95rem;">Cancelar</button>
        <button onclick="publicarVaga()" style="flex:1;padding:.85rem;border:none;border-radius:10px;background:#1a6b3c;color:white;cursor:pointer;font-size:.95rem;font-weight:600;">Publicar Vaga</button>
      </div>
    </div>
  </div>

  <script>
    let user;
    document.addEventListener('DOMContentLoaded', async () => {
      user = DB.getUtilizador();
      if (!user || user.tipo !== 'empresa') { window.location.href = 'login.html'; return; }
      document.getElementById('nomeUtilizador').textContent = '🏢 ' + user.nome;
      await carregarVagas();
    });

    async function carregarVagas() {
      const lista = document.getElementById('listaVagas');
      lista.innerHTML = '<p style="color:#666;">A carregar vagas...</p>';
      const { data, error } = await window.db.from('vagas').select('*').eq('empresa_id', user.id).order('id', { ascending: false });
      if (!data || data.length === 0) {
        lista.innerHTML = '<div style="background:white;border-radius:16px;padding:3rem;text-align:center;box-shadow:0 4px 24px rgba(26,107,60,.08);"><p style="color:#666;font-size:1.1rem;">Ainda não tens vagas publicadas.<br>Clica em "+ Nova Vaga" para começar!</p></div>';
        return;
      }
      lista.innerHTML = data.map(v => `
        <div style="background:white;border-radius:16px;padding:1.5rem 2rem;box-shadow:0 4px 24px rgba(26,107,60,.08);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
          <div>
            <div style="font-size:1.1rem;font-weight:700;color:#1a1a2e;margin-bottom:.4rem;">${v.titulo}</div>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
              <span style="background:rgba(26,107,60,.1);color:#1a6b3c;padding:.25rem .75rem;border-radius:50px;font-size:.8rem;font-weight:600;">${v.area || '—'}</span>
              <span style="background:#f0f0f0;color:#666;padding:.25rem .75rem;border-radius:50px;font-size:.8rem;">📍 ${v.concelho || '—'}</span>
              <span style="background:#f0f0f0;color:#666;padding:.25rem .75rem;border-radius:50px;font-size:.8rem;">💼 ${v.tipo_contrato || '—'}</span>
              <span style="background:${v.estado === 'aberta' ? 'rgba(26,107,60,.1)' : 'rgba(255,0,0,.1)'};color:${v.estado === 'aberta' ? '#1a6b3c' : '#cc0000'};padding:.25rem .75rem;border-radius:50px;font-size:.8rem;font-weight:700;">${v.estado === 'aberta' ? '🟢 Aberta' : '🔴 Fechada'}</span>
            </div>
          </div>
          <div style="display:flex;gap:.5rem;">
            <button onclick="toggleEstado(${v.id}, '${v.estado}')" style="padding:.5rem 1rem;border-radius:8px;border:2px solid #1a6b3c;background:white;color:#1a6b3c;cursor:pointer;font-weight:600;font-size:.85rem;">${v.estado === 'aberta' ? 'Fechar' : 'Reabrir'}</button>
            <button onclick="apagarVaga(${v.id})" style="padding:.5rem 1rem;border-radius:8px;border:2px solid #cc0000;background:white;color:#cc0000;cursor:pointer;font-weight:600;font-size:.85rem;">Apagar</button>
          </div>
        </div>
      `).join('');
    }

    function abrirModal() { document.getElementById('modalVaga').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalVaga').style.display = 'none'; }

    async function publicarVaga() {
      const titulo = document.getElementById('vTitulo').value;
      const area = document.getElementById('vArea').value;
      const concelho = document.getElementById('vConcelho').value;
      const contrato = document.getElementById('vContrato').value;
      const descricao = document.getElementById('vDescricao').value;
      if (!titulo || !area || !concelho) { alert('Preenche pelo menos o título, área e concelho!'); return; }
      const { error } = await window.db.from('vagas').insert([{ empresa_id: user.id, titulo, area, concelho, tipo_contrato: contrato, descricao, estado: 'aberta' }]);
      if (error) { alert('Erro ao publicar: ' + error.message); console.log('Erro:', error); return; }
      fecharModal();
      await carregarVagas();
      mostrarToast('Vaga publicada com sucesso! ✅');
    }

    async function toggleEstado(id, estadoAtual) {
      const novoEstado = estadoAtual === 'aberta' ? 'fechada' : 'aberta';
      await window.db.from('vagas').update({ estado: novoEstado }).eq('id', id);
      await carregarVagas();
    }

    async function apagarVaga(id) {
      if (!confirm('Tens a certeza que queres apagar esta vaga?')) return;
      await window.db.from('vagas').delete().eq('id', id);
      await carregarVagas();
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/database.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
