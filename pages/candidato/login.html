<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — ConectaLeiria</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-container">

    <div class="auth-esquerda">
      <a href="../../index.html" class="logo-texto">Conecta<span class="logo-verde">Leiria</span></a>
      <div class="auth-esquerda-conteudo">
        <h2>Bem-vindo de volta!</h2>
        <p>Entra na tua conta e vê as novas oportunidades de emprego no Distrito de Leiria.</p>
        <div class="auth-beneficios">
          <div class="beneficio"><span>🔔</span> Novas vagas todos os dias</div>
          <div class="beneficio"><span>📄</span> Gere o teu currículo</div>
          <div class="beneficio"><span>🤝</span> Empresas à tua espera</div>
        </div>
      </div>
      <div class="auth-deco">CL</div>
    </div>

    <div class="auth-direita">
      <div class="auth-form-wrap">
        <div class="auth-topo">
          <h1 class="auth-titulo">Entrar</h1>
          <p class="auth-sub">Ainda não tens conta? <a href="registo.html">Regista-te grátis</a></p>
        </div>

        <form id="formLogin" class="auth-form" novalidate>

          <div class="form-grupo">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="joao@email.com" required />
            <span class="erro" id="erro-email"></span>
          </div>

          <div class="form-grupo">
            <label for="senha">Senha</label>
            <div class="input-senha">
              <input type="password" id="senha" placeholder="A tua senha" required />
              <button type="button" class="ver-senha" onclick="toggleSenha('senha')">👁️</button>
            </div>
            <span class="erro" id="erro-senha"></span>
          </div>

          <div class="form-check">
            <input type="checkbox" id="lembrar" />
            <label for="lembrar">Lembrar-me</label>
          </div>

          <button type="submit" class="btn btn-primario btn-grande btn-full">
            Entrar na minha conta →
          </button>

        </form>

        <div class="auth-divisor"><span>ou</span></div>
        <p class="auth-empresa-link">És uma empresa? <a href="../empresa/login.html">Entra como empresa →</a></p>

      </div>
    </div>
  </div>

  <script src="../../js/app.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
